name: Update GitHub Profile

on:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - "projects.json"
      - "scripts/update_profile.py"
      - ".github/workflows/update-profile.yml"
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-github-profile
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate updated profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit profile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes needed."
          else
            git commit -m "chore: automatically update GitHub profile"
            git push
          fi
